# Lokal dev uchun faqat infratuzilma. Ilovalar hostda ishlaydi.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: biolife
      POSTGRES_USER: biolife
      POSTGRES_PASSWORD: biolife
    ports: ["5433:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
volumes:
  pgdata:
